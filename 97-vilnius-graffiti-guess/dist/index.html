<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#141614"><meta name="description" content="Seven graffiti photos. Seven anonymous dots. Get a feel for Vilnius, one guess at a time."><title>Vilnius Graffiti Guess</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body data-mobile-view="photo">
<header><a class="wordmark" href="./" aria-label="Vilnius Graffiti Guess home">VILNIUS<span>GRAFFITI GUESS</span></a><div class="session"><span id="round-label">ROUND 01 / 07</span><div id="progress" aria-label="Round progress"></div></div><button id="sound" class="quiet" aria-pressed="false" aria-label="Enable sound">SOUND OFF <span>↗</span></button></header>
<main>
<div class="action-bar" aria-live="polite"><div><h1 id="reaction">Where was this <em>taken?</em></h1><p id="feedback">Pick a lime dot on the map.</p></div><button class="next" id="next" disabled><span id="next-label">PICK A DOT</span><span>↗</span></button></div>

<nav class="mobile-views" aria-label="Game view"><button data-view="photo" aria-pressed="true">PHOTO</button><button data-view="map" aria-pressed="false">MAP</button></nav>
<div class="game-grid">
<section class="photo-pane" aria-label="Graffiti photograph"><div class="photo-stage" id="photo-stage"><img id="photo" alt="Graffiti photograph; inspect the surroundings and choose a location on the map."><div class="photo-loading" id="photo-loading">DEVELOPING…</div><button id="enlarge" class="image-control" aria-label="Enlarge photograph">⤢</button><div id="photo-status" hidden></div></div></section>
<section class="map-pane" aria-label="Choose a location"><div id="map-wrap"><svg id="map" viewBox="0 0 700 760" role="group" tabindex="0" aria-label="Interactive Vilnius map. Drag to pan, scroll or pinch to zoom. Arrow keys pan, plus and minus zoom, Home fits all locations."><defs><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern></defs><rect width="700" height="760" fill="#222722"/><rect width="700" height="760" fill="url(#grid)"/><g id="geography"></g><g id="connection"></g><g id="landmarks"></g><g id="markers"></g></svg><div class="map-tools" role="group" aria-label="Map controls"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="map-fit" aria-label="Fit all locations and landmarks">FIT ALL</button><button id="map-central" aria-label="Return to the central guessing area">CENTER</button></div><div id="map-scale" aria-label="Map scale"></div><div class="north" aria-hidden="true">N<br>↑</div><div class="map-credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div></div></section>
</div>
<section id="finish" hidden aria-labelledby="finish-title"><p class="eyebrow">YOUR RESULTS</p><h2 id="finish-title">Places <em>found.</em></h2><p id="finish-copy"></p><div id="recap"></div><button id="replay" class="next">PLAY AGAIN <span>↗</span></button></section>
</main>

<dialog id="image-dialog"><button class="close" aria-label="Close enlarged photograph">✕</button><img id="large-photo" alt="Enlarged graffiti photograph"></dialog>

</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sketch-relationship-types</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap">
  <style>
    :root {
      --ground-void: #0a0a0a;
      --ground-base: #0f0f0f;
      --ground-raised: #141414;
      --ground-surface: #1a1a1a;
      --text-primary: #ffffff;
      --text-default: #f5f5f7;
      --text-secondary: #a8aab8;
      --text-tertiary: #666666;
      --text-ghost: #333333;
      --border-subtle: #1a1a1a;
      --border-default: #2a2a2a;
      --accent: #f5a623;
      --font-mono: 'IBM Plex Mono', monospace;
      --space-4: 4px;
      --space-8: 8px;
      --space-16: 16px;
      --space-24: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--ground-void);
      color: var(--text-default);
      font-family: var(--font-mono);
    }
    body { overflow-y: auto; overflow-x: hidden; }

    header {
      position: fixed;
      top: 24px;
      left: 24px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-secondary);
      z-index: 10;
      pointer-events: none;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 72px 24px 96px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border-subtle);
      border: 1px solid var(--border-subtle);
    }

    @media (max-width: 900px) { main { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { main { grid-template-columns: 1fr; } }

    .cell {
      background: var(--ground-base);
      aspect-ratio: 5 / 4;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .cell canvas {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: block;
    }
    .cell .label {
      padding: 0 12px 10px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }
    .cell .label .num {
      color: var(--text-ghost);
      margin-right: 6px;
    }

    footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 14px 24px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--text-tertiary);
      background: linear-gradient(to top, var(--ground-void) 60%, transparent);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<header>sketch-relationship-types</header>

<main id="grid"></main>

<footer id="gloss">a relationship is a constraint on how two things change together.</footer>

<script>
  const INK    = '#f5f5f7';
  const DIM    = '#a8aab8';
  const FAINT  = '#666666';
  const GHOST  = '#333333';
  const ACCENT = '#f5a623';

  // ---- drawing helpers (all in cell-local px) ----

  function node(ctx, x, y, r, color, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function ring(ctx, x, y, r, color, alpha = 1, width = 1) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function edge(ctx, x1, y1, x2, y2, color, alpha = 1, width = 1, dash = null) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // a dot travelling along a segment; phase in [0,1)
  function pulse(ctx, x1, y1, x2, y2, phase, color = ACCENT, r = 3) {
    // comet: a bright head with a fading tail behind it
    const TAIL = 0.18;
    for (let k = 6; k >= 1; k--) {
      const ph = phase - (k / 6) * TAIL;
      if (ph < 0) continue;
      const x = x1 + (x2 - x1) * ph, y = y1 + (y2 - y1) * ph;
      node(ctx, x, y, r * (1 - k / 8), color, 0.55 * (1 - k / 6));
    }
    const x = x1 + (x2 - x1) * phase, y = y1 + (y2 - y1) * phase;
    ctx.shadowColor = color; ctx.shadowBlur = 8;
    node(ctx, x, y, r, color);
    ctx.shadowBlur = 0;
  }

  // a soft glow behind a node
  function glow(ctx, x, y, r, color, alpha) {
    if (alpha <= 0) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = alpha; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---- the sixteen specimens ----
  // each: { name, gloss, draw(ctx, w, h, t) }  t in seconds

  const SPECIMENS = [

    // -- elemental ------------------------------------------------------
    {
      name: 'directed',
      gloss: 'flow with a direction. A acts on B; B cannot answer.',
      draw(ctx, w, h, t) {
        const y = h / 2, ax = w * 0.22, bx = w * 0.78;
        edge(ctx, ax, y, bx, y, GHOST);
        // arrowhead
        edge(ctx, bx - 9, y - 4, bx - 2, y, FAINT);
        edge(ctx, bx - 9, y + 4, bx - 2, y, FAINT);
        const p = (t * 0.55) % 1;
        pulse(ctx, ax, y, bx, y, p);
        const hit = Math.max(0, 1 - ((p + 0.02) % 1) * 5);   // flash just after arrival
        glow(ctx, bx, y, 16, ACCENT, hit * 0.8);
        node(ctx, ax, y, 4.5, INK);
        node(ctx, bx, y, 4 + hit * 2, hit > 0.05 ? INK : FAINT);
      }
    },
    {
      name: 'mutual',
      gloss: 'both ways at once. exchange, conversation, handshake.',
      draw(ctx, w, h, t) {
        const y = h / 2, ax = w * 0.22, bx = w * 0.78, off = 4;
        edge(ctx, ax, y - off, bx, y - off, GHOST);
        edge(ctx, ax, y + off, bx, y + off, GHOST);
        const p = (t * 0.5) % 1;
        pulse(ctx, ax, y - off, bx, y - off, p);
        pulse(ctx, bx, y + off, ax, y + off, p);
        const hit = Math.max(0, 1 - ((p + 0.02) % 1) * 5);
        glow(ctx, ax, y, 16, ACCENT, hit * 0.7);
        glow(ctx, bx, y, 16, ACCENT, hit * 0.7);
        node(ctx, ax, y, 4 + hit * 1.5, INK);
        node(ctx, bx, y, 4 + hit * 1.5, INK);
      }
    },
    {
      name: 'asymmetric',
      gloss: 'both ways, unequal. one gives more than it gets.',
      draw(ctx, w, h, t) {
        const y = h / 2, ax = w * 0.22, bx = w * 0.78, off = 5;
        edge(ctx, ax, y - off, bx, y - off, FAINT, 1, 2);
        edge(ctx, ax, y + off, bx, y + off, GHOST, 0.7, 1);
        // heavy flow A->B: three pulses
        for (let i = 0; i < 3; i++)
          pulse(ctx, ax, y - off, bx, y - off, (t * 0.7 + i / 3) % 1, ACCENT, 3);
        // thin trickle back
        pulse(ctx, bx, y + off, ax, y + off, (t * 0.18) % 1, DIM, 2);
        node(ctx, ax, y, 5, INK);
        node(ctx, bx, y, 3.2, DIM);
      }
    },
    {
      name: 'ephemeral',
      gloss: 'exists only while it happens. contact, then decay.',
      draw(ctx, w, h, t) {
        const y = h / 2, ax = w * 0.22, bx = w * 0.78;
        const cycle = (t % 3.2) / 3.2;             // burst every 3.2s
        const a = Math.exp(-cycle * 5);            // sharp attack, slow decay
        edge(ctx, ax, y, bx, y, INK, a, 1 + a * 1.5);
        if (a > 0.25) pulse(ctx, ax, y, bx, y, cycle * 4 % 1, ACCENT, 3);
        glow(ctx, ax, y, 18, INK, a * 0.5);
        glow(ctx, bx, y, 18, INK, a * 0.5);
        node(ctx, ax, y, 4 + a * 2, a > 0.3 ? INK : DIM);
        node(ctx, bx, y, 4 + a * 2, a > 0.3 ? INK : DIM);
      }
    },

    // -- temporal -------------------------------------------------------
    {
      name: 'latent',
      gloss: 'there all along — visible only when they come close.',
      draw(ctx, w, h, t) {
        const y = h / 2;
        const drift = Math.sin(t * 0.9) * w * 0.24;
        const ax = w * 0.35 - drift / 2, bx = w * 0.65 + drift / 2;
        const d = bx - ax, near = 1 - Math.min(1, Math.max(0, (d - w * 0.16) / (w * 0.22)));
        if (near > 0.02) {
          edge(ctx, ax, y, bx, y, ACCENT, near, 1 + near * 2);
          pulse(ctx, ax, y, bx, y, (t * 0.8) % 1, ACCENT, 2.5 * near);
          pulse(ctx, bx, y, ax, y, (t * 0.8) % 1, ACCENT, 2.5 * near);
        }
        glow(ctx, ax, y, 14, ACCENT, near * 0.6);
        glow(ctx, bx, y, 14, ACCENT, near * 0.6);
        node(ctx, ax, y, 4, INK);
        node(ctx, bx, y, 4, INK);
      }
    },
    {
      name: 'cycle',
      gloss: 'the output returns to its origin. feedback, ritual, grudge.',
      draw(ctx, w, h, t) {
        const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.3;
        const pts = [0, 1, 2].map(i => {
          const a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
          return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
        });
        for (let i = 0; i < 3; i++) {
          const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % 3];
          edge(ctx, x1, y1, x2, y2, GHOST);
        }
        // one pulse forever circling the perimeter
        const p = (t * 0.5) % 1, seg = Math.floor(p * 3), local = (p * 3) % 1;
        const [x1, y1] = pts[seg], [x2, y2] = pts[(seg + 1) % 3];
        pulse(ctx, x1, y1, x2, y2, local);
        pts.forEach(([x, y], i) => {
          const hit = i === seg ? Math.max(0, 1 - local * 4) : 0;
          glow(ctx, x, y, 14, ACCENT, hit * 0.7);
          node(ctx, x, y, 4 + hit * 1.5, INK);
        });
      }
    },
    {
      name: 'transitive',
      gloss: 'friend of a friend. two edges imply a third.',
      draw(ctx, w, h, t) {
        const ax = w * 0.2, ay = h * 0.7;
        const bx = w * 0.5, by = h * 0.26;
        const cx = w * 0.8, cy = h * 0.7;
        edge(ctx, ax, ay, bx, by, FAINT);
        edge(ctx, bx, by, cx, cy, FAINT);
        const c = (t % 5) / 5;
        // step 1: A->B, step 2: B->C, step 3: the implied A->C blooms
        if (c < 0.3) pulse(ctx, ax, ay, bx, by, c / 0.3);
        else if (c < 0.6) pulse(ctx, bx, by, cx, cy, (c - 0.3) / 0.3);
        const a = c < 0.6 ? 0 : Math.min(1, (c - 0.6) / 0.15);
        const fade = c > 0.92 ? 1 - (c - 0.92) / 0.08 : 1;
        edge(ctx, ax, ay, cx, cy, ACCENT, a * fade, 1 + a, [4, 4]);
        if (a > 0.9) pulse(ctx, ax, ay, cx, cy, ((c - 0.75) / 0.2) % 1, ACCENT, 3 * fade);
        node(ctx, ax, ay, 4, INK);
        node(ctx, bx, by, 4, INK);
        node(ctx, cx, cy, 4, INK);
      }
    },
    {
      name: 'broken',
      gloss: 'an edge that was. the stubs remember.',
      draw(ctx, w, h, t) {
        const y = h / 2, ax = w * 0.22, bx = w * 0.78;
        const gapL = w * 0.44, gapR = w * 0.56;
        const jit = () => (Math.sin(t * 13 + ax) + Math.sin(t * 7.3)) * 0.8;
        edge(ctx, ax, y, gapL, y + jit(), FAINT, 0.8);
        edge(ctx, gapR, y - jit(), bx, y, FAINT, 0.8);
        // a pulse still tries: reaches the gap and dies there
        const p = (t * 0.5) % 1;
        if (p < 0.7) pulse(ctx, ax, y, gapL, y, p / 0.7);
        else glow(ctx, gapL, y, 12, ACCENT, (1 - (p - 0.7) / 0.3) * 0.7);
        // rare flicker across the gap
        const flick = Math.max(0, Math.sin(t * 0.9) - 0.98) * 40;
        if (flick > 0) edge(ctx, gapL, y, gapR, y, INK, Math.min(0.5, flick));
        node(ctx, ax, y, 4, DIM);
        node(ctx, bx, y, 4, DIM);
      }
    },

    // -- structural -----------------------------------------------------
    {
      name: 'hierarchy',
      gloss: 'one above many. reporting lines, ancestry, file systems.',
      draw(ctx, w, h, t) {
        const root = [w / 2, h * 0.2];
        const kids = [[w * 0.28, h * 0.52], [w * 0.72, h * 0.52]];
        const grand = [[w * 0.16, h * 0.82], [w * 0.4, h * 0.82], [w * 0.6, h * 0.82], [w * 0.84, h * 0.82]];
        kids.forEach(k => edge(ctx, root[0], root[1], k[0], k[1], GHOST));
        grand.forEach((g, i) => { const k = kids[i >> 1]; edge(ctx, k[0], k[1], g[0], g[1], GHOST); });
        // cascade: pulse root->kid, then kid->grandkids
        const p = (t * 0.6) % 1;
        if (p < 0.5) kids.forEach(k => pulse(ctx, root[0], root[1], k[0], k[1], p * 2));
        else grand.forEach((g, i) => { const k = kids[i >> 1]; pulse(ctx, k[0], k[1], g[0], g[1], (p - 0.5) * 2); });
        const kidHit = p >= 0.5 ? Math.max(0, 1 - (p - 0.5) * 5) : 0;
        const gHit = p < 0.15 ? Math.max(0, 1 - p * 7) : 0;
        glow(ctx, root[0], root[1], 14, ACCENT, p < 0.08 ? 0.7 : 0);
        node(ctx, root[0], root[1], 4.5, INK);
        kids.forEach(k => { glow(ctx, k[0], k[1], 12, ACCENT, kidHit * 0.7); node(ctx, k[0], k[1], 3.5 + kidHit, kidHit > 0.05 ? INK : DIM); });
        grand.forEach(g => { glow(ctx, g[0], g[1], 10, ACCENT, gHit * 0.7); node(ctx, g[0], g[1], 2.8 + gHit, gHit > 0.05 ? INK : FAINT); });
      }
    },
    {
      name: 'hub',
      gloss: 'one speaks, many listen. broadcast, celebrity, server.',
      draw(ctx, w, h, t) {
        const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.34, n = 7;
        const p = (t * 0.5) % 1;
        for (let i = 0; i < n; i++) {
          const a = -Math.PI / 2 + i * (Math.PI * 2 / n);
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          edge(ctx, cx, cy, x, y, GHOST);
          pulse(ctx, cx, cy, x, y, p, ACCENT, 2.2);
          const hit = Math.max(0, 1 - ((p + 0.02) % 1) * 5);
          glow(ctx, x, y, 10, ACCENT, hit * 0.7);
          node(ctx, x, y, 2.8 + hit, hit > 0.05 ? INK : FAINT);
        }
        glow(ctx, cx, cy, 18, ACCENT, p < 0.1 ? 0.7 : 0);
        node(ctx, cx, cy, 5 + (p < 0.1 ? 1.5 : 0), INK);
      }
    },
    {
      name: 'peer',
      gloss: 'all equal, all connected. community as full mesh.',
      draw(ctx, w, h, t) {
        const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.32, n = 5;
        const pts = [];
        for (let i = 0; i < n; i++) {
          const a = -Math.PI / 2 + i * (Math.PI * 2 / n);
          pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
        }
        let e = 0;
        for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
          edge(ctx, pts[i][0], pts[i][1], pts[j][0], pts[j][1], GHOST, 0.8);
          // staggered gentle traffic on every edge
          const ph = (t * 0.32 + e * 0.37) % 1;
          pulse(ctx, pts[i][0], pts[i][1], pts[j][0], pts[j][1], ph, ACCENT, 1.8);
          e++;
        }
        pts.forEach(([x, y]) => node(ctx, x, y, 3.5, INK));
      }
    },
    {
      name: 'broker',
      gloss: 'two worlds joined by one node. power lives in the gap.',
      draw(ctx, w, h, t) {
        const cy = h / 2;
        const L = [[w * 0.14, cy - h * 0.2], [w * 0.1, cy + h * 0.18], [w * 0.26, cy]];
        const R = [[w * 0.86, cy - h * 0.2], [w * 0.9, cy + h * 0.18], [w * 0.74, cy]];
        const B = [w / 2, cy];
        const mesh = g => { for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) edge(ctx, g[i][0], g[i][1], g[j][0], g[j][1], GHOST); };
        mesh(L); mesh(R);
        edge(ctx, L[2][0], L[2][1], B[0], B[1], FAINT);
        edge(ctx, B[0], B[1], R[2][0], R[2][1], FAINT);
        // everything crossing sides must pass through the broker
        const p = (t * 0.6) % 1;
        // alternate direction each cycle
        const dir = Math.floor(t * 0.6) % 2 === 0;
        const from = dir ? L[2] : R[2], to = dir ? R[2] : L[2];
        if (p < 0.5) pulse(ctx, from[0], from[1], B[0], B[1], p * 2);
        else pulse(ctx, B[0], B[1], to[0], to[1], (p - 0.5) * 2);
        const hold = p >= 0.5 ? Math.max(0, 1 - (p - 0.5) * 5) : 0;
        L.concat(R).forEach(([x, y]) => node(ctx, x, y, 3, DIM));
        glow(ctx, B[0], B[1], 20, ACCENT, hold * 0.9);
        node(ctx, B[0], B[1], 4.5 + hold * 2, ACCENT);
      }
    },

    // -- ecological: what the edge does to its ends ---------------------
    {
      name: 'dependency',
      gloss: 'B runs on A. cut the flow and B goes dark.',
      draw(ctx, w, h, t) {
        const y = h / 2, ax = w * 0.22, bx = w * 0.78;
        const cycle = (t % 6) / 6;
        const on = cycle < 0.55;                    // A transmits, then goes quiet
        edge(ctx, ax, y, bx, y, GHOST);
        if (on) pulse(ctx, ax, y, bx, y, (t * 0.6) % 1);
        // B's brightness follows the supply with a lag
        const target = on ? 1 : 0.15;
        const bA = 0.15 + (target - 0.15) * (on ? Math.min(1, cycle * 4) : Math.max(0, 1 - (cycle - 0.55) * 4));
        const lit = Math.max(0.15, Math.min(1, bA));
        glow(ctx, bx, y, 16, ACCENT, (lit - 0.15) * 0.7);
        node(ctx, ax, y, 4, INK);
        node(ctx, bx, y, 2.5 + lit * 2.5, INK, lit);
      }
    },
    {
      name: 'mutualism',
      gloss: 'both are more because the edge exists.',
      draw(ctx, w, h, t) {
        const y = h / 2, ax = w * 0.24, bx = w * 0.76;
        const grow = (Math.sin(t * 0.8) + 1) / 2;   // breathe together
        edge(ctx, ax, y, bx, y, ACCENT, 0.25 + grow * 0.5);
        pulse(ctx, ax, y, bx, y, (t * 0.5) % 1, ACCENT, 2.2);
        pulse(ctx, bx, y, ax, y, (t * 0.5) % 1, ACCENT, 2.2);
        glow(ctx, ax, y, 12 + grow * 10, ACCENT, grow * 0.6);
        glow(ctx, bx, y, 12 + grow * 10, ACCENT, grow * 0.6);
        node(ctx, ax, y, 2.5 + grow * 4, INK);
        node(ctx, bx, y, 2.5 + grow * 4, INK);
        ring(ctx, ax, y, 6 + grow * 6, DIM, 0.6 * grow);
        ring(ctx, bx, y, 6 + grow * 6, DIM, 0.6 * grow);
      }
    },
    {
      name: 'parasitic',
      gloss: 'the edge feeds one by draining the other.',
      draw(ctx, w, h, t) {
        const y = h / 2, ax = w * 0.24, bx = w * 0.76;
        const c = (t % 5) / 5;                       // transfer, then reset
        const rA = 2.5 + c * 5.5, rB = 7 - c * 5.8;
        edge(ctx, bx, y, ax, y, GHOST);
        for (let i = 0; i < 2; i++) pulse(ctx, bx, y, ax, y, (t * 0.8 + i / 2) % 1, ACCENT, 2.5);
        glow(ctx, ax, y, 8 + c * 14, ACCENT, c * 0.6);
        node(ctx, ax, y, rA, INK);
        node(ctx, bx, y, Math.max(1.2, rB), DIM, 1 - c * 0.6);
      }
    },
    {
      name: 'similarity',
      gloss: 'no edge at all — yet they move together. correlation.',
      draw(ctx, w, h, t) {
        const ax = w * 0.3, bx = w * 0.7;
        const bob = Math.sin(t * 1.6) * h * 0.22 + Math.sin(t * 4.1) * h * 0.06;
        const y = h / 2;
        const sz = 3.5 + (Math.sin(t * 2.3) + 1) * 1.2;
        node(ctx, ax, y + bob, sz, INK);
        node(ctx, bx, y + bob, sz, INK);
        // the relation exists only in the eye: the faintest hint
        edge(ctx, ax, y + bob, bx, y + bob, GHOST, 0.18, 1, [1, 6]);
      }
    },
  ];

  // ---- build grid ----

  const grid = document.getElementById('grid');
  const cells = [];

  SPECIMENS.forEach((s, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const cv = document.createElement('canvas');
    const label = document.createElement('div');
    label.className = 'label';
    const num = String(i + 1).padStart(2, '0');
    label.innerHTML = `<span class="num">${num}</span>${s.name}`;
    cell.appendChild(cv);
    cell.appendChild(label);
    grid.appendChild(cell);
    cells.push({ spec: s, canvas: cv, ctx: cv.getContext('2d'), w: 0, h: 0 });
  });

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cells.forEach(c => {
      const r = c.canvas.getBoundingClientRect();
      c.w = r.width; c.h = r.height;
      c.canvas.width = Math.round(r.width * dpr);
      c.canvas.height = Math.round(r.height * dpr);
      c.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    });
  }
  window.addEventListener('resize', resize);
  resize();

  const t0 = performance.now();
  function frame(now) {
    const t = Math.max(0, (now - t0) / 1000);
    cells.forEach(c => {
      if (!c.w) return;
      c.ctx.clearRect(0, 0, c.w, c.h);
      c.spec.draw(c.ctx, c.w, c.h, t);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>

</body>
</html>

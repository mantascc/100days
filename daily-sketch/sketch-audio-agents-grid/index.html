<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audio agents · nine ways</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap">
  <style>
    :root {
      --ground-void: #0a0a0a;
      --ground-base: #0f0f0f;
      --border-default: #1a1a1a;
      --text-secondary: #a8aab8;
      --text-tertiary: #666666;
      --text-ghost: #333333;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; background: var(--ground-void); color: var(--text-secondary);
      font-family: var(--font-mono); overflow: hidden;
      display: grid; place-items: center;
    }
    header {
      position: fixed; top: 20px; left: 24px;
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--text-tertiary); z-index: 10; pointer-events: none;
    }
    .wrapper {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    #stage {
      width: 85vmin; height: 85vmin;
      max-width: 720px; max-height: 720px;
      background: var(--border-default);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 1px;
    }
    .cell {
      position: relative; background: var(--ground-base); overflow: hidden;
    }
    .cell canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      image-rendering: pixelated;
    }
    .cell-label {
      position: absolute; left: 8px; bottom: 6px;
      font-size: 9px; letter-spacing: 0.18em; color: var(--text-ghost);
      text-transform: uppercase; z-index: 2; pointer-events: none;
    }
    .controls { display: flex; align-items: center; gap: 12px; }
    button {
      background: none; border: 1px solid var(--border-default);
      padding: 6px 14px; cursor: pointer;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);
      letter-spacing: 0.14em; text-transform: uppercase;
      transition: border-color 120ms, color 120ms;
      display: flex; align-items: center; gap: 8px;
    }
    button:hover { border-color: #2a2a2a; color: #888; }
    button.playing { border-color: rgba(255,170,0,0.35); color: #888; }
    .light {
      width: 5px; height: 5px; border-radius: 50%;
      background: #2a2a2a;
      transition: background 120ms, box-shadow 120ms;
    }
    button.playing .light {
      background: #ffaa00; box-shadow: 0 0 8px rgba(255,170,0,0.55);
    }
    small { color: var(--text-ghost); font-size: 10px; letter-spacing: 0.14em; }
  </style>
</head>
<body>

<header>audio agents · nine ways</header>

<div class="wrapper">
  <div id="stage"></div>
  <div class="controls">
    <button id="toggle"><span class="light"></span><span id="label">Start Mic</span></button>
  </div>
  <small>make noise · watch nine ways to wake up</small>
</div>

<script>
(() => {
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- Variants ----------
  const VARIANTS = [
    { name: 'DRIFT',   init: initDrift,   update: updateDrift },
    { name: 'ORBIT',   init: initOrbit,   update: updateOrbit },
    { name: 'FLOW',    init: initFlow,    update: updateFlow },
    { name: 'WAVE',    init: initWave,    update: updateWave },
    { name: 'SPIRAL',  init: initSpiral,  update: updateSpiral },
    { name: 'PULSE',   init: initPulse,   update: updatePulse },
    { name: 'LATTICE', init: initLattice, update: updateLattice },
    { name: 'CHASE',   init: initChase,   update: updateChase },
    { name: 'ALIGN',   init: initAlign,   update: updateAlign },
  ];

  const AGENTS_PER_CELL = 60;
  const AGENT_SIZE = 2;
  const GRID = 8;
  const DPR = Math.max(1, Math.min(2, devicePixelRatio || 1));

  // ---------- Build cells ----------
  const stage = document.getElementById('stage');
  const cells = VARIANTS.map(v => {
    const div = document.createElement('div');
    div.className = 'cell';
    const canvas = document.createElement('canvas');
    const label = document.createElement('div');
    label.className = 'cell-label';
    label.textContent = v.name;
    div.append(canvas, label);
    stage.append(div);
    return {
      variant: v,
      canvas,
      ctx: canvas.getContext('2d', { alpha: false }),
      W: 0, H: 0,
      agents: null,
    };
  });

  function resizeAll() {
    for (const cell of cells) {
      const r = cell.canvas.getBoundingClientRect();
      cell.W = Math.floor(r.width);
      cell.H = Math.floor(r.height);
      cell.canvas.width = Math.floor(cell.W * DPR);
      cell.canvas.height = Math.floor(cell.H * DPR);
      cell.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      cell.variant.init(cell);
    }
  }
  new ResizeObserver(resizeAll).observe(stage);
  resizeAll();

  // ---------- Audio ----------
  let ac, analyser, timeData, mediaNode, micStream;
  let env = 0; // smoothed envelope, 0..~0.5

  async function startMic() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    mediaNode = ac.createMediaStreamSource(micStream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.85;
    timeData = new Float32Array(analyser.fftSize);
    mediaNode.connect(analyser);
  }
  function stopMic() {
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (mediaNode) { try { mediaNode.disconnect(); } catch {} mediaNode = null; }
    analyser = null;
  }
  function readRMS() {
    if (!analyser) return 0;
    analyser.getFloatTimeDomainData(timeData);
    let s = 0;
    for (let i = 0; i < timeData.length; i++) s += timeData[i] * timeData[i];
    return Math.sqrt(s / timeData.length);
  }

  // ---------- Loop ----------
  function loop() {
    requestAnimationFrame(loop);
    const t = performance.now() / 1000;
    const rms = readRMS();
    // Hypnotic envelope: fast attack, slow release — energy blooms on sound, sustains after.
    if (rms > env) env += (rms - env) * 0.25;
    else env += (rms - env) * 0.015;

    for (const cell of cells) {
      cell.variant.update(cell, env, t);
      draw(cell);
    }
  }
  loop();

  function drawBackground(cell) {
    const { ctx, W, H } = cell;
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += GRID) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = 0; y <= H; y += GRID) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
  }
  function draw(cell) {
    drawBackground(cell);
    cell.ctx.fillStyle = '#ffffff';
    for (const a of cell.agents) {
      cell.ctx.fillRect(Math.round(a.x), Math.round(a.y), AGENT_SIZE, AGENT_SIZE);
    }
  }

  // ---------- DRIFT: original renormalized-speed random walk ----------
  function initDrift(cell) {
    cell.agents = Array.from({ length: AGENTS_PER_CELL }, () => ({
      x: rand(0, cell.W), y: rand(0, cell.H),
      vx: rand(-0.2, 0.2), vy: rand(-0.2, 0.2),
    }));
  }
  function updateDrift(cell, env) {
    const speed = 0.05 + 25 * env;
    const noise = 0.05 + 50 * env;
    for (const a of cell.agents) {
      a.vx += (Math.random() * 2 - 1) * noise * 0.2;
      a.vy += (Math.random() * 2 - 1) * noise * 0.2;
      const m = Math.hypot(a.vx, a.vy) || 1e-6;
      const k = speed / m;
      a.vx *= k; a.vy *= k;
      a.x += a.vx; a.y += a.vy;
      if (a.x < 0) { a.x = 0; a.vx = Math.abs(a.vx) * 0.98; }
      if (a.y < 0) { a.y = 0; a.vy = Math.abs(a.vy) * 0.98; }
      if (a.x > cell.W - AGENT_SIZE) { a.x = cell.W - AGENT_SIZE; a.vx = -Math.abs(a.vx) * 0.98; }
      if (a.y > cell.H - AGENT_SIZE) { a.y = cell.H - AGENT_SIZE; a.vy = -Math.abs(a.vy) * 0.98; }
    }
  }

  // ---------- ORBIT: circular around center, angular speed reacts ----------
  function initOrbit(cell) {
    cell.agents = Array.from({ length: AGENTS_PER_CELL }, () => ({
      r: rand(6, Math.min(cell.W, cell.H) * 0.45),
      a: Math.random() * Math.PI * 2,
      dir: Math.random() < 0.5 ? 1 : -1,
      x: 0, y: 0,
    }));
  }
  function updateOrbit(cell, env) {
    const cx = cell.W / 2, cy = cell.H / 2;
    const w = 0.005 + env * 0.35;
    for (const a of cell.agents) {
      a.a += a.dir * w;
      a.x = cx + Math.cos(a.a) * a.r;
      a.y = cy + Math.sin(a.a) * a.r;
    }
  }

  // ---------- FLOW: heading from a scrolling sin/cos field ----------
  function initFlow(cell) {
    cell.agents = Array.from({ length: AGENTS_PER_CELL }, () => ({
      x: rand(0, cell.W), y: rand(0, cell.H),
    }));
  }
  function updateFlow(cell, env, t) {
    const speed = 0.15 + env * 18;
    for (const a of cell.agents) {
      const nx = a.x * 0.02, ny = a.y * 0.02;
      const angle = (Math.sin(nx + t * 0.5) + Math.cos(ny - t * 0.3)) * Math.PI;
      a.x += Math.cos(angle) * speed;
      a.y += Math.sin(angle) * speed;
      if (a.x < 0) a.x += cell.W;
      if (a.y < 0) a.y += cell.H;
      if (a.x >= cell.W) a.x -= cell.W;
      if (a.y >= cell.H) a.y -= cell.H;
    }
  }

  // ---------- WAVE: sinusoidal rows, amplitude & frequency react ----------
  function initWave(cell) {
    const rows = 4;
    cell.agents = Array.from({ length: AGENTS_PER_CELL }, (_, i) => {
      const row = i % rows;
      return {
        x0: (i / AGENTS_PER_CELL) * cell.W * rows % cell.W,
        y0: (row + 0.5) * (cell.H / rows),
        phase: (i / AGENTS_PER_CELL) * Math.PI * 4 + row * Math.PI * 0.5,
        x: 0, y: 0,
      };
    });
  }
  function updateWave(cell, env, t) {
    const amp = cell.H * 0.05 + cell.H * 0.5 * env * 2.5;
    const freq = 0.5 + env * 5;
    for (const a of cell.agents) {
      a.x = a.x0;
      a.y = a.y0 + Math.sin(t * freq + a.phase) * amp;
      if (a.y < 0) a.y = 0;
      if (a.y > cell.H - AGENT_SIZE) a.y = cell.H - AGENT_SIZE;
    }
  }

  // ---------- SPIRAL: outward spiral, respawn at center ----------
  function initSpiral(cell) {
    cell.agents = Array.from({ length: AGENTS_PER_CELL }, () => ({
      r: rand(1, Math.min(cell.W, cell.H) * 0.5),
      a: Math.random() * Math.PI * 2,
      x: 0, y: 0,
    }));
  }
  function updateSpiral(cell, env) {
    const cx = cell.W / 2, cy = cell.H / 2;
    const maxR = Math.min(cell.W, cell.H) * 0.5;
    const angVel = 0.02 + env * 0.2;
    const radVel = 0.05 + env * 1.8;
    for (const a of cell.agents) {
      a.a += angVel;
      a.r += radVel;
      if (a.r > maxR) { a.r = 1; a.a = Math.random() * Math.PI * 2; }
      a.x = cx + Math.cos(a.a) * a.r;
      a.y = cy + Math.sin(a.a) * a.r;
    }
  }

  // ---------- PULSE: fixed angles, radius breathes with the sound ----------
  function initPulse(cell) {
    cell.agents = Array.from({ length: AGENTS_PER_CELL }, (_, i) => ({
      a: (i / AGENTS_PER_CELL) * Math.PI * 2,
      phase: Math.random() * Math.PI * 2,
      r0: rand(8, Math.min(cell.W, cell.H) * 0.42),
      x: 0, y: 0,
    }));
  }
  function updatePulse(cell, env, t) {
    const cx = cell.W / 2, cy = cell.H / 2;
    const beat = Math.max(0.15, 1 + Math.sin(t * (1 + env * 6)) * (0.15 + env * 1.2));
    for (const a of cell.agents) {
      const r = a.r0 * beat * (0.7 + 0.3 * Math.sin(a.phase + t * 0.6));
      a.x = cx + Math.cos(a.a) * r;
      a.y = cy + Math.sin(a.a) * r;
    }
  }

  // ---------- LATTICE: springs to grid anchors, jitter reacts ----------
  function initLattice(cell) {
    const cols = Math.round(Math.sqrt(AGENTS_PER_CELL));
    const rows = Math.ceil(AGENTS_PER_CELL / cols);
    const sx = cell.W / (cols + 1);
    const sy = cell.H / (rows + 1);
    cell.agents = [];
    for (let i = 0; i < AGENTS_PER_CELL; i++) {
      const ax = (i % cols + 1) * sx;
      const ay = (Math.floor(i / cols) + 1) * sy;
      cell.agents.push({ ax, ay, x: ax, y: ay, vx: 0, vy: 0 });
    }
  }
  function updateLattice(cell, env) {
    const k = 0.08;
    const damp = 0.82;
    const kick = 0.03 + env * 4;
    for (const a of cell.agents) {
      a.vx += (a.ax - a.x) * k + (Math.random() * 2 - 1) * kick;
      a.vy += (a.ay - a.y) * k + (Math.random() * 2 - 1) * kick;
      a.vx *= damp; a.vy *= damp;
      a.x += a.vx; a.y += a.vy;
    }
  }

  // ---------- CHASE: each agent pursues the next in a ring ----------
  function initChase(cell) {
    cell.agents = Array.from({ length: AGENTS_PER_CELL }, () => ({
      x: rand(0, cell.W), y: rand(0, cell.H),
    }));
  }
  function updateChase(cell, env) {
    const speed = 0.15 + env * 12;
    const N = cell.agents.length;
    for (let i = 0; i < N; i++) {
      const a = cell.agents[i];
      const target = cell.agents[(i + 1) % N];
      const dx = target.x - a.x;
      const dy = target.y - a.y;
      const m = Math.hypot(dx, dy) || 1e-6;
      a.x += (dx / m) * speed;
      a.y += (dy / m) * speed;
    }
  }

  // ---------- ALIGN: Vicsek-style neighbor heading alignment ----------
  function initAlign(cell) {
    cell.agents = Array.from({ length: AGENTS_PER_CELL }, () => ({
      x: rand(0, cell.W), y: rand(0, cell.H),
      a: Math.random() * Math.PI * 2,
    }));
  }
  function updateAlign(cell, env) {
    const R = 24, R2 = R * R;
    const speed = 0.15 + env * 12;
    const noise = 0.05 + env * 1.2;
    const next = new Float32Array(cell.agents.length);
    for (let i = 0; i < cell.agents.length; i++) {
      const a = cell.agents[i];
      let sx = Math.cos(a.a), sy = Math.sin(a.a);
      for (let j = 0; j < cell.agents.length; j++) {
        if (j === i) continue;
        const b = cell.agents[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        if (dx * dx + dy * dy < R2) { sx += Math.cos(b.a); sy += Math.sin(b.a); }
      }
      next[i] = Math.atan2(sy, sx) + (Math.random() * 2 - 1) * noise;
    }
    for (let i = 0; i < cell.agents.length; i++) {
      const a = cell.agents[i];
      a.a = next[i];
      a.x += Math.cos(a.a) * speed;
      a.y += Math.sin(a.a) * speed;
      if (a.x < 0) a.x += cell.W;
      if (a.y < 0) a.y += cell.H;
      if (a.x >= cell.W) a.x -= cell.W;
      if (a.y >= cell.H) a.y -= cell.H;
    }
  }

  // ---------- UI ----------
  const btn = document.getElementById('toggle');
  const label = document.getElementById('label');
  let running = false;
  btn.addEventListener('click', async () => {
    if (!running) {
      try {
        await startMic();
        if (ac.state === 'suspended') await ac.resume();
        running = true;
        btn.classList.add('playing');
        label.textContent = 'Stop';
      } catch (err) {
        console.error(err);
        alert('Microphone access failed. Check browser permissions.');
      }
    } else {
      stopMic();
      running = false;
      btn.classList.remove('playing');
      label.textContent = 'Start Mic';
    }
  });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Sketch · Retro Primitives</title>
<meta name="description" content="Animated neon primitive shapes in a fuzzy old-screen 2x2 grid.">
<style>
:root {
  --void: #07100f;
  --ink: #d8fff1;
  --muted: rgba(216, 255, 241, 0.54);
  --dim: rgba(216, 255, 241, 0.22);
  --line: rgba(118, 255, 205, 0.2);
  --green: #65ffbd;
  --amber: #ffb14a;
  --orange: #ff573d;
  --rose: #ff6ba8;
  --blue: #50b9ff;
  --tile: 200px;
  --gap: 16px;
  --font: "IBM Plex Mono", "SF Mono", Monaco, Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  min-height: 100%;
}

body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 40px 20px;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 50% 34%, rgba(255, 120, 64, 0.16), transparent 32%),
    radial-gradient(circle at 52% 68%, rgba(88, 255, 186, 0.12), transparent 30%),
    linear-gradient(180deg, #081514 0%, var(--void) 48%, #040706 100%);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

.shell {
  display: grid;
  gap: 18px;
  justify-items: center;
}

.mast {
  width: min(100%, calc(2 * var(--tile) + var(--gap)));
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 10px;
  line-height: 1.4;
}

.mast strong {
  color: var(--ink);
  font-weight: 400;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, var(--tile));
  gap: var(--gap);
}

.cell {
  position: relative;
  width: var(--tile);
  height: var(--tile);
  overflow: hidden;
  border: 1px solid var(--line);
  background:
    radial-gradient(circle at 50% 45%, rgba(255, 157, 69, 0.12), transparent 46%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.16)),
    #08110f;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.02) inset,
    0 0 28px rgba(94, 255, 192, 0.12);
  isolation: isolate;
}

.cell::before,
.cell::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}

.cell::before {
  opacity: 0.38;
  mix-blend-mode: screen;
  background:
    repeating-linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.08) 0 1px,
      transparent 1px 4px
    );
}

.cell::after {
  background:
    linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent),
    radial-gradient(circle at 50% 45%, transparent 38%, rgba(0, 0, 0, 0.38) 100%);
  opacity: 0.28;
  animation: roll 4.8s linear infinite;
}

canvas {
  display: block;
  width: 200px;
  height: 200px;
  image-rendering: auto;
}

.label {
  position: absolute;
  left: 10px;
  bottom: 8px;
  z-index: 3;
  color: var(--dim);
  font-size: 9px;
  letter-spacing: 0.16em;
  line-height: 1;
  text-transform: uppercase;
  pointer-events: none;
}

.meter {
  width: 92px;
  height: 11px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 3px;
}

.meter span {
  display: block;
  border-top: 2px solid var(--green);
  border-bottom: 2px solid var(--green);
  opacity: 0.56;
  box-shadow: 0 0 10px rgba(101, 255, 189, 0.68);
  animation: blink 1.2s steps(2, end) infinite;
}

.meter span:nth-child(2) { animation-delay: 0.14s; }
.meter span:nth-child(3) { animation-delay: 0.28s; }
.meter span:nth-child(4) { animation-delay: 0.42s; }
.meter span:nth-child(5) { animation-delay: 0.56s; }

@keyframes roll {
  from { transform: translateY(-16px); }
  to { transform: translateY(16px); }
}

@keyframes blink {
  0%, 72% { opacity: 0.7; }
  73%, 100% { opacity: 0.22; }
}

@media (max-width: 470px) {
  body {
    place-items: start center;
    padding: 24px 14px 40px;
  }

  .mast {
    width: var(--tile);
    flex-direction: column;
    align-items: start;
  }

  .grid {
    grid-template-columns: var(--tile);
  }
}
</style>
</head>
<body>
<main class="shell" aria-label="Animated retro primitive shapes">
  <div class="mast">
    <div><strong>daily sketch</strong> / retro primitives</div>
    <div class="meter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <section class="grid" aria-label="Primitive shape grid">
    <figure class="cell">
      <canvas data-shape="circle" aria-label="Animated neon circle"></canvas>
      <figcaption class="label">circle</figcaption>
    </figure>
    <figure class="cell">
      <canvas data-shape="square" aria-label="Animated neon square"></canvas>
      <figcaption class="label">square</figcaption>
    </figure>
    <figure class="cell">
      <canvas data-shape="triangle" aria-label="Animated neon triangle"></canvas>
      <figcaption class="label">triangle</figcaption>
    </figure>
    <figure class="cell">
      <canvas data-shape="ellipse" aria-label="Animated neon ellipse"></canvas>
      <figcaption class="label">ellipse</figcaption>
    </figure>
  </section>
</main>

<script>
const CSS_SIZE = 200;
const SCALE = Math.min(window.devicePixelRatio || 1, 2);
const SIZE = CSS_SIZE * SCALE;
const TWO_PI = Math.PI * 2;

const palette = {
  mint: '#65ffbd',
  pale: '#d8fff1',
  amber: '#ffb14a',
  orange: '#ff573d',
  rose: '#ff6ba8',
  blue: '#50b9ff'
};

const configs = {
  circle: {
    label: 'circle',
    hueShift: 0,
    gradient: [palette.orange, palette.amber, palette.mint],
    draw: drawCircle
  },
  square: {
    label: 'square',
    hueShift: 0.9,
    gradient: [palette.rose, palette.orange, palette.mint],
    draw: drawSquare
  },
  triangle: {
    label: 'triangle',
    hueShift: 1.6,
    gradient: [palette.amber, palette.orange, palette.blue],
    draw: drawTriangle
  },
  ellipse: {
    label: 'ellipse',
    hueShift: 2.2,
    gradient: [palette.orange, palette.amber, palette.mint],
    draw: drawEllipse
  }
};

const canvases = [...document.querySelectorAll('canvas[data-shape]')].map((canvas, index) => {
  const ctx = canvas.getContext('2d', { alpha: false });
  canvas.width = SIZE;
  canvas.height = SIZE;
  canvas.style.width = `${CSS_SIZE}px`;
  canvas.style.height = `${CSS_SIZE}px`;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  return {
    canvas,
    ctx,
    config: configs[canvas.dataset.shape],
    index,
    noiseSeed: 20 + index * 97
  };
});

function wobble(t, amount, phase) {
  return Math.sin(t * 1.7 + phase) * amount + Math.sin(t * 0.61 + phase * 2.1) * amount * 0.38;
}

function noise(seed, x, y, t) {
  const n = Math.sin((x * 12.9898 + y * 78.233 + seed * 37.719 + t * 8.13) * 43758.5453);
  return n - Math.floor(n);
}

function beginGlow(ctx, blur, alpha) {
  ctx.globalAlpha = alpha;
  ctx.shadowColor = palette.mint;
  ctx.shadowBlur = blur;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
}

function makeGradient(ctx, colors, t) {
  const drift = Math.sin(t * 0.56) * 18;
  const gradient = ctx.createLinearGradient(70 + drift, 34, 118 - drift, 170);
  gradient.addColorStop(0, colors[0]);
  gradient.addColorStop(0.56, colors[1]);
  gradient.addColorStop(1, colors[2]);
  return gradient;
}

function strokePath(ctx, path, color, width, blur, alpha) {
  ctx.save();
  beginGlow(ctx, blur, alpha);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke(path);
  ctx.restore();
}

function fillPath(ctx, path, fill, blur, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = palette.orange;
  ctx.shadowBlur = blur;
  ctx.fillStyle = fill;
  ctx.fill(path);
  ctx.restore();
}

function drawCircle(ctx, t, config) {
  const cx = 100 + wobble(t, 2.2, 0.2);
  const cy = 100 + wobble(t, 1.7, 2.4);
  const r = 63 + wobble(t, 3.2, 1.8);
  const squish = 0.96 + Math.sin(t * 0.9) * 0.035;
  const path = new Path2D();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, squish);
  path.arc(0, 0, r, 0, TWO_PI);
  fillPath(ctx, path, makeGradient(ctx, config.gradient, t), 20, 0.82);
  strokePath(ctx, path, palette.mint, 5.5, 18, 0.95);
  strokePath(ctx, path, palette.pale, 2, 5, 0.86);

  for (let i = -1; i <= 1; i++) {
    const y = i * 31 + Math.sin(t * 1.4 + i) * 4;
    const ring = new Path2D();
    ring.ellipse(0, y, r + 4, 13 + i * 2, 0, 0, TWO_PI);
    strokePath(ctx, ring, i === 0 ? palette.pale : palette.mint, i === 0 ? 3.6 : 3, 12, 0.82);
  }
  ctx.restore();
}

function drawSquare(ctx, t, config) {
  const side = 102 + wobble(t, 5, 1.1);
  const cx = 100 + wobble(t, 2.2, 3.1);
  const cy = 101 + wobble(t, 2, 0.7);
  const skew = Math.sin(t * 0.72) * 0.08;
  const path = new Path2D();
  path.rect(-side / 2, -side / 2, side, side);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.transform(1, skew, -skew * 0.6, 1, 0, 0);
  fillPath(ctx, path, makeGradient(ctx, config.gradient, t), 22, 0.76);
  strokePath(ctx, path, palette.mint, 5.5, 18, 0.94);
  strokePath(ctx, path, palette.pale, 2, 5, 0.82);

  for (let i = -1; i <= 1; i++) {
    const y = i * 29 + Math.sin(t * 1.2 + i * 2) * 3;
    const line = new Path2D();
    line.moveTo(-side / 2 - 7, y);
    line.lineTo(side / 2 + 7, y + Math.sin(t + i) * 2);
    strokePath(ctx, line, i === 0 ? palette.pale : palette.mint, i === 0 ? 3.5 : 2.5, 11, 0.78);
  }
  ctx.restore();
}

function drawTriangle(ctx, t, config) {
  const cx = 100 + wobble(t, 2.4, 0.6);
  const cy = 102 + wobble(t, 2, 3.8);
  const h = 118 + wobble(t, 4.4, 2.1);
  const w = 126 + wobble(t, 5, 1.6);
  const path = new Path2D();
  path.moveTo(0, -h / 2);
  path.lineTo(w / 2, h / 2);
  path.lineTo(-w / 2, h / 2);
  path.closePath();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(t * 0.45) * 0.035);
  fillPath(ctx, path, makeGradient(ctx, config.gradient, t), 24, 0.78);
  strokePath(ctx, path, palette.mint, 5.5, 18, 0.94);
  strokePath(ctx, path, palette.pale, 2, 5, 0.82);

  for (let i = 0; i < 3; i++) {
    const y = -22 + i * 30 + Math.sin(t * 1.1 + i) * 3;
    const span = Math.max(20, w * (0.26 + i * 0.19));
    const line = new Path2D();
    line.moveTo(-span / 2, y);
    line.lineTo(span / 2, y + Math.sin(t * 0.9 + i) * 2);
    strokePath(ctx, line, i === 1 ? palette.pale : palette.mint, i === 1 ? 3.5 : 2.5, 11, 0.78);
  }
  ctx.restore();
}

function drawEllipse(ctx, t, config) {
  const cx = 100 + wobble(t, 2.3, 1.7);
  const cy = 101 + wobble(t, 1.7, 4.2);
  const rx = 72 + wobble(t, 4.2, 2.5);
  const ry = 48 + wobble(t, 3, 0.9);
  const tilt = Math.sin(t * 0.6) * 0.12;
  const path = new Path2D();
  path.ellipse(0, 0, rx, ry, tilt, 0, TWO_PI);

  ctx.save();
  ctx.translate(cx, cy);
  fillPath(ctx, path, makeGradient(ctx, config.gradient, t), 22, 0.8);
  strokePath(ctx, path, palette.mint, 5.5, 18, 0.94);
  strokePath(ctx, path, palette.pale, 2, 5, 0.82);

  for (let i = -1; i <= 1; i++) {
    const band = new Path2D();
    band.ellipse(0, i * 20 + Math.sin(t * 1.2 + i) * 3, rx + 5, 9, tilt, 0, TWO_PI);
    strokePath(ctx, band, i === 0 ? palette.pale : palette.mint, i === 0 ? 3.4 : 2.6, 10, 0.76);
  }
  ctx.restore();
}

function drawVignette(ctx) {
  const gradient = ctx.createRadialGradient(100, 92, 24, 100, 100, 132);
  gradient.addColorStop(0, 'rgba(255,255,255,0)');
  gradient.addColorStop(0.62, 'rgba(0,0,0,0.05)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.64)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, CSS_SIZE, CSS_SIZE);
}

function drawNoise(ctx, seed, t) {
  const step = 2;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let y = 0; y < CSS_SIZE; y += step) {
    for (let x = 0; x < CSS_SIZE; x += step) {
      const n = noise(seed, x, y, t);
      if (n > 0.55) {
        const alpha = (n - 0.55) * 0.22;
        ctx.fillStyle = `rgba(184, 255, 224, ${alpha})`;
        ctx.fillRect(x, y, step, step);
      }
    }
  }
  ctx.restore();
}

function drawChromaticEcho(ctx, config, t) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.26;
  ctx.translate(1.4 + Math.sin(t * 2.2 + config.hueShift) * 0.8, 0);
  config.draw(ctx, t + 0.035, config);
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.18;
  ctx.translate(-1.6 + Math.cos(t * 1.8 + config.hueShift) * 0.7, 0.4);
  ctx.shadowColor = palette.rose;
  config.draw(ctx, t - 0.025, config);
  ctx.restore();
}

function draw(item, now) {
  const t = now * 0.001 + item.index * 0.42;
  const { ctx, config } = item;

  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#07100f';
  ctx.fillRect(0, 0, CSS_SIZE, CSS_SIZE);

  ctx.save();
  ctx.globalAlpha = 0.58;
  ctx.fillStyle = makeGradient(ctx, config.gradient, t);
  ctx.filter = 'blur(18px)';
  ctx.beginPath();
  ctx.ellipse(100, 104, 78, 70, 0, 0, TWO_PI);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.filter = 'blur(5px)';
  drawChromaticEcho(ctx, config, t);
  ctx.restore();

  config.draw(ctx, t, config);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.24;
  ctx.fillStyle = palette.mint;
  ctx.fillRect(35, 168 + Math.sin(t * 3) * 3, 130, 2);
  ctx.restore();

  drawVignette(ctx);
  drawNoise(ctx, item.noiseSeed, t);
}

function frame(now) {
  canvases.forEach((item) => draw(item, now));
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
